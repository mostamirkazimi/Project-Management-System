<nav
  class="relative z-50 flex min-h-[68px] border-b border-slate-300 bg-white px-4 py-2 dark:border-neutral-700 dark:bg-neutral-900 md:px-8"
  aria-label="Main navigation"
>
  <div
    class="mx-auto flex w-full max-w-7xl flex-wrap items-center justify-between gap-4"
  >

    <!-- ===================================================== -->
    <!-- LOGO -->
    <!-- ===================================================== -->

    <a
      routerLink="/dashboard"
      (click)="closeMenu()"
      class="inline-flex min-w-9 items-center gap-3 rounded focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500"
    >
      <span class="sr-only">Project Management System</span>

      <img
        src="../../../../../assets/logo .jpeg"
        alt="Project Management System"
        class="h-10 w-10 rounded-full object-cover"
      />

      <div class="hidden sm:block">
        <h1
          class="text-lg font-bold text-slate-900 dark:text-white"
        >
          Project<span class="text-indigo-600">Flow</span>
        </h1>

        <p
          class="text-[10px] font-medium uppercase tracking-wider text-slate-400"
        >
          Project Management
        </p>
      </div>
    </a>


    <!-- ===================================================== -->
    <!-- NAVIGATION -->
    <!-- ===================================================== -->

    <div
      id="collapseMenu"
      [class.hidden]="!isMenuOpen"
      class="fixed right-0 top-0 z-50 h-full w-full overflow-auto border-l border-slate-300 bg-white shadow-md dark:border-neutral-700 dark:bg-neutral-900 sm:w-1/2 lg:static lg:block lg:h-auto lg:w-auto lg:overflow-visible lg:border-0 lg:bg-transparent lg:shadow-none dark:lg:bg-transparent"
    >

      <!-- ================================================= -->
      <!-- MOBILE HEADER -->
      <!-- ================================================= -->

      <div
        class="sticky top-0 flex min-h-[68px] items-center justify-between border-b border-slate-300 bg-white px-4 dark:border-neutral-700 dark:bg-neutral-900 lg:hidden"
      >

        <a
          routerLink="/dashboard"
          (click)="closeMenu()"
          class="inline-flex items-center gap-2 rounded focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500"
        >
          <img
            src="../../../assets/logo.jpeg"
            alt="Project Management System"
            class="h-9 w-9 rounded-full object-cover"
          />

          <span
            class="font-bold text-slate-900 dark:text-white"
          >
            Project<span class="text-indigo-600">Flow</span>
          </span>
        </a>


        <!-- CLOSE -->

        <button
          type="button"
          (click)="closeMenu()"
          class="cursor-pointer rounded p-2 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500"
          aria-label="Close main menu"
        >

          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-5 w-5 fill-slate-900 dark:fill-slate-50"
            viewBox="0 0 329.269 329"
          >
            <path
              d="M194.8 164.77 323.013 36.555c8.343-8.34 8.343-21.825 0-30.164-8.34-8.34-21.825-8.34-30.164 0L164.633 134.605 36.422 6.391c-8.344-8.34-21.824-8.34-30.164 0-8.344 8.34-8.344 21.824 0 30.164l128.21 128.215L6.259 292.984c-8.344 8.34-8.344 21.825 0 30.164a21.27 21.27 0 0 0 15.082 6.25c5.46 0 10.922-2.09 15.082-6.25l128.21-128.214 128.216 128.214a21.27 21.27 0 0 0 15.082 6.25c8.343-8.34 8.343-21.824 0-30.164z"
            />
          </svg>

        </button>

      </div>


      <!-- ================================================= -->
      <!-- MENU ITEMS -->
      <!-- ================================================= -->

      <ul
        class="flex flex-col gap-2 p-6 text-sm font-semibold text-slate-900 dark:text-slate-50 lg:flex-row lg:items-center lg:gap-6 lg:p-0"
      >

        <!-- Dashboard -->

        <li>
          <a
            routerLink="/dashboard"
            routerLinkActive="text-blue-700 dark:text-blue-400"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="closeMenu()"
            class="block rounded px-2 py-2 transition hover:text-blue-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 dark:hover:text-blue-400"
          >
            Dashboard
          </a>
        </li>


        <!-- Projects -->

        <li>
          <a
            routerLink="/projects"
            routerLinkActive="text-blue-700 dark:text-blue-400"
            (click)="closeMenu()"
            class="block rounded px-2 py-2 transition hover:text-blue-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 dark:hover:text-blue-400"
          >
            Projects
          </a>
        </li>


        <!-- Tasks -->

        <li>
          <a
            routerLink="/tasks"
            routerLinkActive="text-blue-700 dark:text-blue-400"
            (click)="closeMenu()"
            class="block rounded px-2 py-2 transition hover:text-blue-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 dark:hover:text-blue-400"
          >
            Tasks
          </a>
        </li>


        <!-- Team -->

        <li>
          <a
            routerLink="/team"
            routerLinkActive="text-blue-700 dark:text-blue-400"
            (click)="closeMenu()"
            class="block rounded px-2 py-2 transition hover:text-blue-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 dark:hover:text-blue-400"
          >
            Team
          </a>
        </li>


        <!-- Blog -->

        <li>
          <a
            routerLink="/blog"
            routerLinkActive="text-blue-700 dark:text-blue-400"
            (click)="closeMenu()"
            class="block rounded px-2 py-2 transition hover:text-blue-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 dark:hover:text-blue-400"
          >
            Blog
          </a>
        </li>


        <!-- About -->

        <li>
          <a
            routerLink="/about"
            routerLinkActive="text-blue-700 dark:text-blue-400"
            (click)="closeMenu()"
            class="block rounded px-2 py-2 transition hover:text-blue-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 dark:hover:text-blue-400"
          >
            About
          </a>
        </li>


        <!-- Contact -->

        <li>
          <a
            routerLink="/contact"
            routerLinkActive="text-blue-700 dark:text-blue-400"
            (click)="closeMenu()"
            class="block rounded px-2 py-2 transition hover:text-blue-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 dark:hover:text-blue-400"
          >
            Contact
          </a>
        </li>


        <!-- Profile -->

        <li class="lg:hidden">
          <a
            routerLink="/users"
            (click)="closeMenu()"
            class="block rounded px-2 py-2 transition hover:text-blue-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 dark:hover:text-blue-400"
          >
            Profile
          </a>
        </li>


        <!-- Change Password -->

        <li class="lg:hidden">
          <a
            routerLink="/change-password"
            (click)="closeMenu()"
            class="block rounded px-2 py-2 transition hover:text-blue-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 dark:hover:text-blue-400"
          >
            Change Password
          </a>
        </li>

      </ul>

    </div>


    <!-- ===================================================== -->
    <!-- RIGHT SIDE -->
    <!-- ===================================================== -->

    <div class="flex items-center gap-3">

      <!-- Profile -->

      <a
        routerLink="/users"
        class="hidden text-sm font-semibold text-slate-900 hover:text-blue-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 dark:text-slate-50 dark:hover:text-blue-400 sm:block"
      >
        Profile
      </a>


      <!-- Login -->

      <a
        routerLink="/login"
        class="hidden text-sm font-semibold text-slate-900 hover:text-blue-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 dark:text-slate-50 dark:hover:text-blue-400 sm:block"
      >
        Login
      </a>


      <!-- Logout -->

      <button
        type="button"
        (click)="logout()"
        class="rounded-md border border-blue-600 bg-indigo-600 px-3.5 py-2 text-sm font-semibold text-white transition-all hover:bg-indigo-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500"
      >
        Logout
      </button>


      <!-- MOBILE MENU BUTTON -->

      <button
        type="button"
        (click)="toggleMenu()"
        [attr.aria-expanded]="isMenuOpen"
        aria-controls="collapseMenu"
        class="cursor-pointer rounded p-1 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 lg:hidden"
      >

        <span class="sr-only">
          Open main menu
        </span>

        <svg
          class="h-7 w-7 fill-slate-900 dark:fill-slate-50"
          aria-hidden="true"
          viewBox="0 0 20 20"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            fill-rule="evenodd"
            d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 10a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 15a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z"
            clip-rule="evenodd"
          ></path>
        </svg>

      </button>

    </div>

  </div>
</nav>
