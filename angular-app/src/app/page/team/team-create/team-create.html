<div class="min-h-screen bg-gray-50 p-4 sm:p-6 lg:p-8">

  <div class="mx-auto max-w-2xl">


<!-- Header -->
<div class="mb-6">

  <h1 class="text-2xl font-bold text-gray-900 sm:text-3xl">
    Create Team
  </h1>

  <p class="mt-1 text-sm text-gray-500">
    Create a new team and assign it to a project.
  </p>

</div>


<!-- Error -->
@if (errorMessage) {

  <div
    class="mb-6 rounded-lg border border-red-200
           bg-red-50 p-4 text-sm text-red-700"
  >
    {{ errorMessage }}
  </div>

}


<!-- Form -->
<form
  (ngSubmit)="createTeam()"
  class="rounded-xl border border-gray-200
         bg-white p-6 shadow-sm sm:p-8"
>

  <!-- Team Name -->
  <div class="mb-5">

    <label
      for="name"
      class="mb-2 block text-sm font-medium text-gray-700"
    >
      Team Name
    </label>

    <input
      id="name"
      name="name"
      type="text"
      [(ngModel)]="team.name"
      placeholder="Enter team name"
      required
      maxlength="255"
      class="w-full rounded-lg border border-gray-300
             px-4 py-2.5 text-sm text-gray-900
             outline-none transition
             focus:border-blue-500 focus:ring-2
             focus:ring-blue-500/20"
    />

  </div>


  <!-- Description -->
  <div class="mb-5">

    <label
      for="description"
      class="mb-2 block text-sm font-medium text-gray-700"
    >
      Description
    </label>

    <textarea
      id="description"
      name="description"
      [(ngModel)]="team.description"
      rows="4"
      placeholder="Enter team description"
      class="w-full resize-none rounded-lg
             border border-gray-300 px-4 py-2.5
             text-sm text-gray-900 outline-none
             transition focus:border-blue-500
             focus:ring-2 focus:ring-blue-500/20"
    ></textarea>

  </div>


  <!-- Project -->
  <div class="mb-6">

    <label
      for="projectId"
      class="mb-2 block text-sm font-medium text-gray-700"
    >
      Project
    </label>

    @if (loadingProjects) {

      <div
        class="flex items-center gap-2 rounded-lg
               border border-gray-300 bg-gray-50
               px-4 py-2.5 text-sm text-gray-500"
      >

        <div
          class="h-4 w-4 animate-spin rounded-full
                 border-2 border-gray-300
                 border-t-blue-600"
        ></div>

        Loading projects...

      </div>

    } @else {

      <select
        id="projectId"
        name="projectId"
        [(ngModel)]="team.projectId"
        required
        class="w-full rounded-lg border border-gray-300
               bg-white px-4 py-2.5 text-sm
               text-gray-900 outline-none transition
               focus:border-blue-500
               focus:ring-2 focus:ring-blue-500/20"
      >

        <option [ngValue]="0">
          Select a project
        </option>

        @for (project of projects; track project.id) {

          <option [ngValue]="project.id">
            {{ project.name }}
          </option>

        }

      </select>

    }

  </div>


  <!-- Actions -->
  <div
    class="flex flex-col-reverse gap-3
           sm:flex-row sm:justify-end"
  >

    <button
      type="button"
      class="rounded-lg border border-gray-300
             px-5 py-2.5 text-sm font-medium
             text-gray-700 transition
             hover:bg-gray-50"
    >
      Cancel
    </button>

    <button
      type="submit"
      class="rounded-lg bg-blue-600 px-5 py-2.5
             text-sm font-medium text-white
             shadow-sm transition hover:bg-blue-700
             focus:outline-none focus:ring-2
             focus:ring-blue-500 focus:ring-offset-2"
    >
      Create Team
    </button>

  </div>

</form>


  </div>

</div>
